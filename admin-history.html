<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>История заявок — FL Studio</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true">
      <div class="bg-circle-purple"></div>
      <div class="bg-circle-pink"></div>
      <div class="bg-circle-cyan"></div>
      <div class="bg-ring"></div>
    </div>

    <section class="admin-page">
      <div class="container">
        <h2 class="section-title">ИСТОРИЯ ЗАЯВОК</h2>

        <div class="admin-panel">
          <a href="admin.html" class="admin-back">
            <i class="fas fa-arrow-left"></i> Назад в админку
          </a>

          <!-- Фильтр -->
          <div class="admin-card">
            <h3>Фильтр</h3>
            <div class="admin-filter">
              <button
                class="admin-filter-btn active"
                data-filter="all"
                onclick="setFilter('all')"
              >
                Все
              </button>
              <button
                class="admin-filter-btn"
                data-filter="confirmed"
                onclick="setFilter('confirmed')"
              >
                ✅ Подтверждённые
              </button>
              <button
                class="admin-filter-btn"
                data-filter="pending"
                onclick="setFilter('pending')"
              >
                ⏳ Ожидающие
              </button>
              <button
                class="admin-filter-btn"
                data-filter="cancelled"
                onclick="setFilter('cancelled')"
              >
                ❌ Отменённые
              </button>
            </div>
          </div>

          <!-- Список -->
          <div class="admin-card">
            <h3>
              Заявки
              <span id="historyCount" class="admin-history-count" style="color: white;">0</span>
            </h3>
            <div class="admin-history-list" id="historyList">
              <p class="admin-empty">Загрузка...</p>
            </div>
          </div>

          <button
            class="admin-logout"
            onclick="window.location.href = 'admin.html'"
          >
            <i class="fas fa-arrow-left"></i> Вернуться в админку
          </button>
        </div>
      </div>
    </section>

    <script src="js/admin-history.js"></script>
  </body>
</html>
