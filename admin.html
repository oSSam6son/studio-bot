<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Админ-панель — FL Studio</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true">
      <div class="bg-circle-purple"></div>
      <div class="bg-circle-pink"></div>
      <div class="bg-circle-cyan"></div>
      <div class="bg-ring"></div>
      <div class="bg-dot bg-dot-1"></div>
      <div class="bg-dot bg-dot-2"></div>
      <div class="bg-dot bg-dot-3"></div>
      <div class="bg-dot bg-dot-4"></div>
      <div class="bg-dot bg-dot-5"></div>
    </div>

    <section class="admin-page">
      <div class="container">
        <h2 class="section-title">АДМИН-ПАНЕЛЬ</h2>

        <!-- Экран входа -->
        <div class="admin-login" id="adminLogin">
          <a href="about.html" class="admin-back">
            <i class="fas fa-arrow-left"></i> На главную
          </a>

          <div class="admin-login-box">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              id="adminPassword"
              placeholder="Введите пароль"
            />
            <button onclick="checkPassword()">Войти</button>
          </div>
        </div>

        <!-- Экран панели -->
        <div class="admin-panel" id="adminPanel" style="display: none">
          <!-- Закрыть ВЕСЬ день -->
          <div class="admin-card">
            <h3>Закрыть весь день</h3>
            <div class="admin-date-input">
              <input
                type="text"
                id="adminDate"
                placeholder="ДД.ММ.ГГГГ"
                maxlength="10"
                oninput="formatAdminDate(this)"
              />
              <button onclick="closeDay()">
                <i class="fas fa-lock"></i> Закрыть день
              </button>
            </div>
          </div>

          <!-- Список занятых дат -->
          <div class="admin-card">
            <h3>Занятые даты</h3>
            <div class="admin-dates-list" id="adminDatesList">
              <p class="admin-empty">Загрузка...</p>
            </div>
          </div>

          <button class="admin-logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Выйти
          </button>
        </div>
      </div>
    </section>

    <script src="js/telegram.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
