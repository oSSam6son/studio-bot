<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Услуги — FL Studio</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      (function () {
        const script = document.createElement("script");
        script.src = "js/telegram-web-app.js";
        script.onerror = function () {
          const fallback = document.createElement("script");
          fallback.src = "https://telegram.org/js/telegram-web-app.js";
          document.head.appendChild(fallback);
        };
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true">
      <div class="bg-circle-purple"></div>
      <div class="bg-circle-pink"></div>
      <div class="bg-circle-cyan"></div>
      <div class="bg-ring"></div>
    </div>

    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Назад
    </a>

    <section class="services-page">
      <div class="container">
        <h2 class="section-title">УСЛУГИ</h2>
        <p class="section-subtitle">Выберите подходящий формат работы</p>

        <div class="services-grid" id="servicesGrid">
          <!-- Заполняется JavaScript -->
        </div>
      </div>
    </section>

    <script src="js/telegram.js"></script>
    <script src="js/services.js"></script>
  </body>
</html>
