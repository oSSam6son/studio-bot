<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>FL Studio — Студия звукозаписи</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      (function () {
        const script = document.createElement("script");
        script.src = "js/telegram-web-app.js";
        script.onerror = function () {
          const fallback = document.createElement("script");
          fallback.src = "https://telegram.org/js/telegram-web-app.js";
          document.head.appendChild(fallback);
        };
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true">
      <div class="bg-circle-purple"></div>
      <div class="bg-circle-pink"></div>
      <div class="bg-circle-cyan"></div>
      <div class="bg-ring"></div>
      <div class="bg-dot bg-dot-1"></div>
      <div class="bg-dot bg-dot-2"></div>
      <div class="bg-dot bg-dot-3"></div>
      <div class="bg-dot bg-dot-4"></div>
      <div class="bg-dot bg-dot-5"></div>
    </div>

    <section class="hero hero-fullpage" id="hero">
      <div class="hero-bg"></div>
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <h1 class="hero-title">
          <span>ЗВУК,</span>
          <span class="outline">КОТОРЫЙ</span>
          <span>ЗАХОДИТ</span>
        </h1>
        <p class="hero-subtitle">Профессиональная студия звукозаписи</p>
        <div class="hero-buttons">
          <a href="services.html" class="btn-primary">
            <i class="fas fa-calendar"></i> Записаться
          </a>
          <a href="about.html" class="btn-outline">
            <i class="fas fa-info-circle"></i> О студии
          </a>
        </div>
      </div>

      <div class="hero-stats">
        <div class="stat">
          <span class="stat-number">10+</span>
          <span class="stat-label">лет опыта</span>
        </div>
        <div class="stat">
          <span class="stat-number">500+</span>
          <span class="stat-label">проектов</span>
        </div>
        <div class="stat">
          <span class="stat-number">24/7</span>
          <span class="stat-label">доступ</span>
        </div>
      </div>
    </section>
    <!-- Всплывающее уведомление -->
    <div class="promo-banner" id="promoBanner">
      <div class="promo-content">
        <div class="promo-icon">
          <i class="fas fa-fire"></i>
        </div>
        <div class="promo-text">
          <span class="promo-title">СКИДКА 30%</span>
          <span class="promo-subtitle">на первый заказ</span>
        </div>
        <a href="services.html" class="promo-btn">Выбрать услугу</a>
        <button class="promo-close" onclick="closePromo()">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <script src="js/telegram.js"></script>
  </body>
</html>
